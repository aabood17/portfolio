<!doctype html>
<!-- Template for public/og-image.png (the preview shown when the link is shared). Rendered by scripts/generate-og.mjs. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 88px;
        box-sizing: border-box;
        background: #0b0e13;
        color: #e6e8ec;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      }
      img {
        width: 300px;
        height: 300px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid #242b37;
        outline: 2px solid #8fb5e6;
        outline-offset: 10px;
        flex-shrink: 0;
      }
      .mono {
        font-family: "Cascadia Mono", Consolas, monospace;
        color: #8fb5e6;
      }
      h1 {
        margin: 16px 0 0;
        font-size: 68px;
        line-height: 1.05;
        letter-spacing: -0.02em;
      }
      .role {
        margin-top: 16px;
        font-size: 34px;
      }
      .stack {
        margin-top: 32px;
        font-size: 26px;
        color: #9ba3b1;
      }
      .url {
        margin-top: 40px;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <img src="../src/assets/profile.jpeg" alt="" />
    <div>
      <div class="mono">~/aburiala</div>
      <h1>Abdullah Abu Riala</h1>
      <div class="role mono">Software Engineer</div>
      <div class="stack">Java/Spring Boot · PHP/Laravel · React · Flutter</div>
      <div class="url">Bethlehem, Palestine · aburiala.vercel.app</div>
    </div>
  </body>
</html>
